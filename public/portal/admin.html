<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superuser - PrimeConnector Admin</title>
  <link rel="icon" type="image/png" href="/portal/assets/primeconnector-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #25d366;
      --danger: #ef4444;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --input-bg: rgba(11, 15, 25, 0.8);
      --input-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #080c14 80%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .key-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #062b13;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    .table th, .table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 14px;
    }

    .table th {
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      font-size: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-success { background: rgba(37, 211, 102, 0.15); color: #34d399; }
    .badge-none { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }

    .btn-del {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 22px;
      background: #1f2937;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 12px;
      display: none;
      z-index: 100;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <div>
        <h2 style="font-size: 20px; font-weight: 700;">Superuser: User Management</h2>
        <p style="font-size: 13px; color: var(--text-muted);">Create & Manage Portal Users and Monitor their Single Allowed Instance</p>
      </div>
      <div class="key-box">
        <input type="password" id="superApiKey" placeholder="Global API Key (e.g. kaliparrot9098)" style="background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 10px; padding: 10px 14px; color: #fff; font-size: 13px; width: 220px;">
        <button id="btnSetKey" class="btn" style="padding: 10px 18px;">Set Key</button>
      </div>
    </div>

    <!-- Create User Form -->
    <div class="card">
      <h3 style="font-size: 18px; margin-bottom: 16px;">Create New User</h3>
      <form id="createUserForm">
        <div class="form-grid">
          <div class="form-group">
            <label>FULL NAME</label>
            <input type="text" id="userName" placeholder="e.g. Vaibhav Kumar" required>
          </div>
          <div class="form-group">
            <label>EMAIL ADDRESS</label>
            <input type="email" id="userEmail" placeholder="vaibhav@example.com" required>
          </div>
          <div class="form-group">
            <label>PORTAL PASSWORD</label>
            <input type="password" id="userPassword" placeholder="••••••••••••" required>
          </div>
        </div>
        <button type="submit" id="btnProvision" class="btn">Provision User</button>
      </form>
    </div>

    <!-- User List Table -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 18px;">Registered Users & Assigned Instance</h3>
        <button id="btnRefresh" class="btn" style="background: rgba(255, 255, 255, 0.1); padding: 8px 16px;">Refresh Table</button>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>User</th>
            <th>Email</th>
            <th>Instance Status</th>
            <th>Instance Name</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 24px;">Enter Global API Key above to load users</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    function getApiKey() {
      const inputVal = document.getElementById('superApiKey').value.trim();
      if (inputVal) return inputVal;
      return localStorage.getItem('evolution_global_apikey') || '';
    }

    const savedKey = localStorage.getItem('evolution_global_apikey') || '';
    if (savedKey) {
      document.getElementById('superApiKey').value = savedKey;
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.borderColor = isError ? '#ef4444' : '#25d366';
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    document.getElementById('btnSetKey').addEventListener('click', () => {
      const key = document.getElementById('superApiKey').value.trim();
      if (!key) {
        showToast('Please enter the Global API Key', true);
        return;
      }
      localStorage.setItem('evolution_global_apikey', key);
      showToast('Global API Key saved! Loading users...');
      loadUsers();
    });

    document.getElementById('superApiKey').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('btnSetKey').click();
      }
    });

    async function loadUsers() {
      const key = getApiKey();
      if (!key) {
        document.getElementById('userTableBody').innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 24px;">Please enter your Global API Key above and click Set Key</td></tr>';
        return;
      }

      try {
        const res = await fetch('/admin/users/list', {
          headers: { 'apikey': key }
        });

        const data = await res.json();

        if (!res.ok) {
          const errMsg = data.response?.message || data.message || 'Invalid API Key or unauthorized';
          showToast(errMsg, true);
          document.getElementById('userTableBody').innerHTML = `<tr><td colspan="5" style="text-align: center; color: #f87171; padding: 24px;">${errMsg}. Please verify your Global API Key.</td></tr>`;
          return;
        }

        renderTable(data);
      } catch (err) {
        showToast(err.message, true);
      }
    }

    function renderTable(users) {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '';

      if (!users || users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 24px;">No users created yet. Use the form above to provision a user.</td></tr>';
        return;
      }

      users.forEach(u => {
        const tr = document.createElement('tr');
        const instStatus = u.instance ? `<span class="badge badge-success">${u.instance.connectionStatus || 'active'}</span>` : '<span class="badge badge-none">No Instance</span>';
        const instName = u.instance ? u.instance.name : '---';

        tr.innerHTML = `
          <td><strong>${u.name}</strong></td>
          <td>${u.email}</td>
          <td>${instStatus}</td>
          <td><code>${instName}</code></td>
          <td>
            <button class="btn-del" onclick="deleteUser('${u.id}')">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = getApiKey();
      if (!key) {
        showToast('Please enter and set your Global API Key first', true);
        document.getElementById('superApiKey').focus();
        return;
      }

      const name = document.getElementById('userName').value.trim();
      const email = document.getElementById('userEmail').value.trim();
      const password = document.getElementById('userPassword').value;

      const btn = document.getElementById('btnProvision');
      btn.disabled = true;
      btn.textContent = 'Provisioning...';

      try {
        const res = await fetch('/admin/users/create', {
          method: 'POST',
          headers: {
            'apikey': key,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();
        if (!res.ok) {
          const errMsg = data.response?.message || data.message || 'Failed to create user';
          throw new Error(Array.isArray(errMsg) ? errMsg[0] : errMsg);
        }

        showToast(`User "${name}" created successfully!`);
        document.getElementById('createUserForm').reset();
        loadUsers();
      } catch (err) {
        showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Provision User';
      }
    });

    async function deleteUser(id) {
      const key = getApiKey();
      if (!confirm('Are you sure you want to delete this user?')) return;
      try {
        const res = await fetch(`/admin/users/${id}`, {
          method: 'DELETE',
          headers: { 'apikey': key }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.response?.message || data.message || 'Failed to delete user');
        showToast('User deleted');
        loadUsers();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    document.getElementById('btnRefresh').addEventListener('click', loadUsers);

    if (savedKey) {
      loadUsers();
    }
  </script>
</body>
</html>
